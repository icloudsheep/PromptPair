<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/themes/base.css?v=20260730.13" />
    <link rel="stylesheet" href="/themes/light.css?v=20260730.13" />
    <link rel="stylesheet" href="/themes/dark.css?v=20260730.13" />
    <script type="module" src="/scripts/main.js?v=20260730.13"></script>
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <a class="brand" href="/" aria-label="">
          <span class="brand-mark" aria-hidden="true"><i></i><i></i></span>
          <span><strong data-i18n="app.name"></strong><small data-i18n="app.tagline"></small></span>
        </a>
        <div class="header-actions">
          <span class="status-pill" id="model-status"><i></i><span></span></span>
          <button class="icon-button" id="settings-button" type="button" aria-label=""></button>
          <button class="icon-button" id="theme-toggle" type="button" aria-label=""></button>
          <a class="icon-button header-about" id="repo-link" target="_blank" rel="noreferrer"></a>
        </div>
      </header>

      <main class="workspace">
        <aside class="library-panel panel" aria-labelledby="library-title">
          <div class="panel-heading">
            <div><span class="eyebrow" data-i18n="library.eyebrow"></span><h1 id="library-title" data-i18n="library.title"></h1></div>
            <span class="count-badge" id="block-count"></span>
          </div>
          <label class="search-field">
            <span id="search-icon" aria-hidden="true"></span>
            <input id="prompt-search" type="search" autocomplete="off" />
            <kbd data-i18n="library.searchShortcut"></kbd>
          </label>
          <nav class="category-tabs" id="category-tabs" aria-label=""></nav>
          <div class="library-list" id="library-list"></div>
        </aside>

        <section class="composer-panel panel" aria-labelledby="composer-title">
          <div class="panel-heading composer-heading">
            <div><span class="eyebrow" data-i18n="composer.eyebrow"></span><h2 id="composer-title" data-i18n="composer.title"></h2></div>
            <div class="composer-actions">
              <button class="text-button" id="clear-button" type="button" data-i18n="actions.clear"></button>
              <button class="text-button action-button" id="share-button" type="button"></button>
            </div>
          </div>
          <div class="canvas" id="composer-canvas">
            <div class="empty-state" id="empty-state">
              <div class="empty-illustration" aria-hidden="true"><i></i><i></i><i></i></div>
              <h3 data-i18n="composer.emptyTitle"></h3>
              <p data-i18n="composer.emptyDescription"></p>
            </div>
            <div class="block-stack" id="block-stack"></div>
          </div>
          <div class="generate-bar">
            <div class="generate-meta"><strong data-i18n="generate.readyTitle"></strong><span id="token-estimate"></span></div>
            <button class="primary-button" id="generate-button" type="button"></button>
          </div>
        </section>

        <aside class="result-panel panel" aria-labelledby="result-title">
          <div class="panel-heading">
            <div><span class="eyebrow" data-i18n="result.eyebrow"></span><h2 id="result-title" data-i18n="result.title"></h2></div>
            <div class="result-actions">
              <button class="text-button" id="copy-button" type="button"></button>
              <button class="icon-button result-close" id="result-close" type="button" aria-label=""></button>
            </div>
          </div>
          <div class="result-placeholder" id="result-placeholder">
            <div class="spark-icon" id="result-icon"></div>
            <p data-i18n="result.placeholder"></p>
          </div>
          <div class="result-content markdown-body" id="result-content" tabindex="0" hidden></div>
        </aside>
      </main>
    </div>
    <section class="settings-view" id="settings-view" aria-labelledby="settings-title" hidden>
      <header class="settings-header">
        <div><span class="eyebrow" data-i18n="settings.eyebrow"></span><h1 id="settings-title" data-i18n="settings.title"></h1></div>
        <div class="settings-header-actions"><span class="save-status" id="settings-save-status"></span><button class="icon-button" id="settings-close" type="button" aria-label=""></button></div>
      </header>
      <div class="settings-layout">
        <nav class="settings-nav" id="settings-nav" aria-label="">
          <button class="settings-nav-item active" type="button" data-section="general" data-i18n="settings.general"></button>
          <button class="settings-nav-item" type="button" data-section="blocks" data-i18n="settings.blocks"></button>
        </nav>
        <main class="settings-content">
          <section class="settings-section" data-settings-section="general">
            <h2 data-i18n="settings.language"></h2><p data-i18n="settings.languageDescription"></p>
            <label class="field"><span data-i18n="settings.language"></span><span class="select-shell"><select id="locale-select"></select><i aria-hidden="true"></i></span></label>
          </section>
          <section class="settings-section" data-settings-section="blocks" hidden>
            <h2 data-i18n="settings.blocks"></h2><p data-i18n="settings.blocksDescription"></p>
            <div class="block-settings-grid">
              <div class="settings-column">
                <div class="settings-column-heading"><strong data-i18n="settings.categoryLabel"></strong><button class="settings-add-button" id="settings-add-category" type="button"><span data-i18n="settings.addCategory"></span></button></div>
                <div class="settings-list" id="settings-categories"></div>
              </div>
              <div class="settings-column">
                <div class="settings-column-heading"><strong data-i18n="settings.blockLabel"></strong><button class="settings-add-button" id="settings-add-block" type="button"><span data-i18n="settings.addBlock"></span></button></div>
                <div class="settings-list" id="settings-blocks"></div>
              </div>
              <form class="block-form" id="block-form">
                <div class="settings-column-heading"><strong id="settings-editor-title"></strong><span class="settings-delete-actions"><button class="settings-delete-button" id="settings-delete-block" type="button"><span data-i18n="settings.deleteBlock"></span></button><button class="settings-delete-button" id="settings-delete-category" type="button"><span data-i18n="settings.deleteCategory"></span></button></span></div>
                <div class="form-empty" id="block-form-empty" data-i18n="settings.chooseCategory"></div>
                <div class="settings-form-fields" id="settings-category-fields" hidden>
                  <label class="field"><span data-i18n="settings.categoryName"></span><input name="categoryName" maxlength="80" required /></label>
                  <label class="field"><span data-i18n="settings.categoryDescription"></span><textarea name="categoryDescription" maxlength="240" required></textarea></label>
                  <label class="field field-color"><span data-i18n="settings.categoryColor"></span><input name="categoryColor" type="color" required /></label>
                </div>
                <div class="settings-form-fields" id="settings-block-fields" hidden>
                  <div class="field-row"><label class="field"><span data-i18n="settings.name"></span><input name="name" maxlength="120" required /></label><label class="field compact"><span data-i18n="settings.icon"></span><input name="icon" maxlength="8" required /></label></div>
                  <label class="field"><span data-i18n="settings.summary"></span><input name="summary" maxlength="300" required /></label>
                  <label class="field"><span data-i18n="settings.type"></span><span class="select-shell"><select name="type"></select><i aria-hidden="true"></i></span></label>
                  <label class="field"><span data-i18n="settings.prompt"></span><textarea class="prompt-field" name="prompt" maxlength="12000" required></textarea></label>
                </div>
              </form>
            </div>
          </section>
        </main>
      </div>
    </section>
    <dialog class="recipe-dialog" id="recipe-dialog" aria-labelledby="recipe-dialog-title">
      <div class="recipe-dialog-card">
        <header class="recipe-dialog-header">
          <div><span class="eyebrow" data-i18n="sharing.eyebrow"></span><h2 id="recipe-dialog-title" data-i18n="sharing.title"></h2></div>
          <button class="icon-button" id="recipe-dialog-close" type="button" aria-label=""></button>
        </header>
        <p data-i18n="sharing.description"></p>
        <label class="recipe-code-field"><span data-i18n="sharing.codeLabel"></span><textarea id="recipe-code" spellcheck="false"></textarea></label>
        <div class="recipe-dialog-actions">
          <button class="text-button action-button" id="recipe-copy" type="button" data-i18n="sharing.copy"></button>
          <button class="primary-button" id="recipe-apply" type="button" data-i18n="sharing.apply"></button>
        </div>
      </div>
    </dialog>
    <div class="library-tooltip" id="library-tooltip" role="tooltip" hidden></div>
    <div class="toast-region" id="toast-region" aria-live="polite" data-load-error="配置加载失败，请检查资源文件后刷新页面。"></div>
  </body>
</html>
